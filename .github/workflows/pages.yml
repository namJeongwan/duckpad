name: Website

on:
  pull_request:
    paths:
      - 'duckpad-jekyll/**'
      - '.github/workflows/pages.yml'
      - 'scripts/prepare_sparkle_feed.py'
      - 'scripts/test_prepare_sparkle_feed.py'
  push:
    branches: [main]
    paths:
      - 'duckpad-jekyll/**'
      - '.github/workflows/pages.yml'
      - 'scripts/prepare_sparkle_feed.py'
      - 'scripts/test_prepare_sparkle_feed.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release metadata selection
        run: |
          ruby duckpad-jekyll/test-release-sync.rb
          python3 scripts/test_prepare_sparkle_feed.py
      - name: Select published download assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/duckpad-release.json"
          ruby duckpad-jekyll/sync-release.rb "$RUNNER_TEMP/duckpad-release.json"
      - name: Build website
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./duckpad-jekyll
          destination: ./_site
      - name: Verify translations, routes, and links
        run: python3 duckpad-jekyll/verify-site.py _site
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
