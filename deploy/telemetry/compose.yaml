name: dp-telemetry

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a pinned PostgreSQL image}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_DB: aptabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aptabase -d aptabase"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?Set a pinned ClickHouse image}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Generate .env first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/duckpad.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  aptabase:
    image: ${APTABASE_IMAGE:?Set a pinned Aptabase image}
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - path: ./.private/smtp.env
        required: false
        format: raw
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:?Set public HTTPS URL}
      REGION: SH
      AUTH_SECRET: ${AUTH_SECRET:?Generate .env first}
      DATABASE_URL: Server=postgres;Port=5432;User Id=aptabase;Password=${POSTGRES_PASSWORD};Database=aptabase
      CLICKHOUSE_URL: Host=clickhouse;Port=8123;Username=aptabase;Password=${CLICKHOUSE_PASSWORD}
    ports:
      # Local bootstrap / SSH access only. Cloudflare connects to the proxy.
      - 127.0.0.1:4318:8080
    logging: *logging

  proxy:
    image: ${NGINX_IMAGE:?Set a pinned nginx image}
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - aptabase
    ports:
      - 127.0.0.1:4317:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logging
