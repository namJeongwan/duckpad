# This listener is reachable only through the local Cloudflare Tunnel.
limit_req_zone $http_cf_connecting_ip zone=ingestion:10m rate=5r/s;
limit_req_zone $http_cf_connecting_ip zone=signin:1m rate=2r/m;
limit_req_zone $server_name zone=signin_global:1m rate=5r/m;

server {
    listen 80;
    server_name dp-stats.hongyoungjun.com;
    client_max_body_size 128k;
    client_body_timeout 10s;
    access_log off;

    # Keep query strings (magic login links) out of the nginx error log.
    error_log /dev/null crit;

    location ~* ^/api/_auth/register/?$ { return 403; }

    location ~* ^/api/_auth/signin/?$ {
        limit_except POST { deny all; }
        limit_req zone=signin burst=2 nodelay;
        limit_req zone=signin_global burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://aptabase:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location ~* ^/api/v0/events?/?$ {
        limit_except POST { deny all; }
        limit_req zone=ingestion burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://aptabase:8080;
        # Rate limiting uses IP only here. Do not forward IP, cookies, geo
        # headers or any client-supplied identity to the analytics application.
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
        proxy_set_header App-Key $http_app_key;
        proxy_set_header User-Agent Duckpad-Usage/1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://aptabase:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
